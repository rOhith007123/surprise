<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
    overflow:hidden;
    text-align:center;
}

#text{
    font-size:32px;
}

button{
    margin-top:30px;
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}
</style>

</head>

<body>

<div>

<h1 id="text">Initializing Surprise...</h1>

<button onclick="start()">Continue</button>

</div>

<script>

function start(){

const messages=[
"Connecting to your heart ❤️",
"Loading memories...",
"Checking smile level...",
"100% Beautiful ✔",
"Final Message...",
"I love you ❤️"
];

let i=0;

const interval=setInterval(()=>{

document.getElementById("text").innerHTML=messages[i];

i++;

if(i==messages.length){
clearInterval(interval);
}

},1500);

}

</script>

</body>
</html>
